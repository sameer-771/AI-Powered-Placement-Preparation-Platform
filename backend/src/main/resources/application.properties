server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/placement_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CHANGE_ME_SUPER_SECRET
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
